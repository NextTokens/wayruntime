version = 1

[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  "CONTRIBUTING.md",
  "LICENSING.md",
  "Makefile",
  "NOTICE",
  "README.md",
  "THIRD-PARTY-NOTICES.md",
  "docs/**",
  "examples/**",
  "include/**",
  "src/**",
  "test/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 WayOS Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "DCO"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"
